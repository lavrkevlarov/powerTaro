  <style>
:root {
  --bg: #07051a;
  --bg2: #120c33;
  --gold: #e9c97a;
  --gold-2: #f8e6b0;
  --violet: #8b6cff;
  --rose: #ff8fb8;
  --text: #efe9ff;
  --muted: #a79fc9;
  --glass: rgba(26, 18, 66, .55);
  --line: rgba(233, 201, 122, .25);
  --cw: 120px;
  --fcw: 70px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'Manrope', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
html { background: var(--bg); }
body {
  background: radial-gradient(ellipse at 50% -10%, #2a1a66 0%, var(--bg2) 35%, var(--bg) 75%) fixed;
  color: var(--text);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
#sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.nebula {
  position: fixed; inset: -20%; z-index: 0; pointer-events: none; opacity: .55;
  background:
    radial-gradient(circle at 20% 30%, rgba(139, 108, 255, .25), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(255, 143, 184, .16), transparent 40%),
    radial-gradient(circle at 60% 20%, rgba(80, 160, 255, .12), transparent 35%);
  animation: drift 40s ease-in-out infinite alternate;
  filter: blur(10px);
}
@keyframes drift { to { transform: translate(4%, -3%) rotate(8deg) scale(1.1); } }

/* верхняя панель */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  background: linear-gradient(to bottom, rgba(7, 5, 26, .85), rgba(7, 5, 26, 0));
}
.brand { display: flex; align-items: center; gap: 10px; color: var(--gold); font-family: var(--serif); font-size: 26px; font-weight: 700; letter-spacing: .5px; }
.brand svg { animation: slowspin 30s linear infinite; }
@keyframes slowspin { to { transform: rotate(360deg); } }
.icon-btn {
  width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
  border: 1px solid var(--line); background: rgba(255, 255, 255, .04); color: var(--gold);
  transition: .3s var(--ease);
}
.icon-btn:hover { background: rgba(233, 201, 122, .12); transform: rotate(-12deg); }

.app { position: relative; z-index: 1; max-width: 1040px; margin: 0 auto; padding-block: 0 60px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.screen { display: none; }
.screen.active { display: block; animation: screenIn .8s var(--ease) both; }
@keyframes screenIn { from { opacity: 0; transform: translateY(24px) scale(.98); filter: blur(6px); } }

/* герой */
.hero { text-align: center; padding: 8px 0 18px; }
.title { font-family: var(--serif); font-size: clamp(38px, 7vw, 60px); font-weight: 700; margin: 10px 0 6px;
  background: linear-gradient(100deg, var(--gold-2), var(--gold) 40%, #fff 50%, var(--gold) 60%, var(--gold-2));
  background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shimmer 6s linear infinite; }
@keyframes shimmer { to { background-position: -250% 0; } }
.hero-simple { min-height: calc(100vh - 140px); min-height: calc(100svh - 140px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.hero-simple .orb { transform: scale(1.4); margin-bottom: 50px; }
.hero-simple .lead { font-size: 17px; }
.btn-primary.btn-go { width: min(320px, 100%); margin-top: 36px; padding: 20px; font-size: 20px; letter-spacing: 3px; text-transform: uppercase; animation: goPulse 3s ease-in-out infinite; }
@keyframes goPulse { 50% { box-shadow: 0 10px 50px rgba(233, 201, 122, .65), 0 0 0 8px rgba(233, 201, 122, .08); } }
.lead { color: var(--muted); margin: 0 auto; max-width: 420px; line-height: 1.5; }

.orb { position: relative; width: 150px; height: 150px; margin: 0 auto; }
.orb-core { position: absolute; inset: 42px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff, #e0c8ff 20%, #8b6cff 55%, #2a1466 100%);
  box-shadow: 0 0 40px rgba(139, 108, 255, .8), 0 0 90px rgba(233, 201, 122, .35);
  animation: breathe 4s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.12); box-shadow: 0 0 60px rgba(139, 108, 255, 1), 0 0 120px rgba(233, 201, 122, .5); } }
.orb-ring { position: absolute; inset: 0; border-radius: 50%; border: 1px solid var(--line); }
.orb-ring.r1 { animation: slowspin 14s linear infinite; border-top-color: var(--gold); }
.orb-ring.r2 { inset: 14px; animation: slowspin 9s linear infinite reverse; border-left-color: var(--rose); }
.orb-ring.r3 { inset: 28px; border-style: dashed; animation: slowspin 22s linear infinite; }
.orb-cards span { position: absolute; left: 50%; top: 50%; width: 22px; height: 36px; margin: -18px -11px; border-radius: 4px;
  background: linear-gradient(160deg, #3a2580, #140c35); border: 1px solid var(--gold);
  animation: orbit 7s linear infinite; }
.orb-cards span:nth-child(2) { animation-delay: -2.33s; }
.orb-cards span:nth-child(3) { animation-delay: -4.66s; }
@keyframes orbit { from { transform: rotate(0) translateX(78px) rotate(0); } to { transform: rotate(360deg) translateX(78px) rotate(-360deg); } }

/* панель вопроса */
.panel {
  max-width: 640px; margin: 0 auto; padding: 22px;
  background: var(--glass); border: 1px solid var(--line); border-radius: 24px;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 20px 60px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .06);
}
.tabs { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); padding: 4px; border-radius: 16px; background: rgba(0, 0, 0, .3); margin-bottom: 18px; }
.tab { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 11px 6px; border-radius: 12px; color: var(--muted); font-weight: 600; font-size: 14px; transition: color .3s; }
.tab svg { width: 18px; height: 18px; flex: none; }
.tab.active { color: #1a1033; }
.tab-glider { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / 3); border-radius: 12px;
  background: linear-gradient(135deg, var(--gold-2), var(--gold)); box-shadow: 0 4px 20px rgba(233, 201, 122, .4);
  transition: transform .5s var(--ease); }

.mode { display: none; }
.mode.active { display: block; animation: fadeUp .5s var(--ease) both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } }

.field { position: relative; }
textarea {
  width: 100%; resize: none; padding: 16px 58px 16px 16px; border-radius: 16px;
  background: rgba(0, 0, 0, .35); border: 1px solid var(--line); color: var(--text);
  font: 500 17px/1.45 var(--sans); outline: none; transition: border-color .3s, box-shadow .3s;
}
textarea::placeholder { color: rgba(167, 159, 201, .7); }
textarea:focus { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(233, 201, 122, .12), 0 0 30px rgba(139, 108, 255, .25); }
.mic-small { position: absolute; right: 10px; top: 10px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--gold); background: rgba(233, 201, 122, .1); transition: .3s; }
.mic-small svg { width: 20px; height: 20px; }
.mic-small:hover { background: rgba(233, 201, 122, .22); }
.mic-small.rec, .mic-big.rec { color: #fff; background: #e2456e; }

.voice-stage { display: none; flex-direction: column; align-items: center; gap: 10px; padding: 6px 0 16px; }
#askBox.voice .voice-stage { display: flex; }
#askBox.voice .mic-small { display: none; }
.mic-big { position: relative; width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; color: #1a1033;
  background: radial-gradient(circle at 35% 30%, var(--gold-2), var(--gold)); box-shadow: 0 0 30px rgba(233, 201, 122, .5); transition: .3s; }
.mic-big svg { width: 38px; height: 38px; position: relative; z-index: 1; }
.mic-big .wave { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--gold); opacity: 0; }
.mic-big.rec .wave { animation: wave 1.8s ease-out infinite; border-color: #ff7aa0; }
.mic-big.rec .w2 { animation-delay: .6s; } .mic-big.rec .w3 { animation-delay: 1.2s; }
@keyframes wave { from { transform: scale(1); opacity: .8; } to { transform: scale(2.1); opacity: 0; } }
.voice-hint { color: var(--muted); font-size: 14px; min-height: 20px; }

.suggest { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.suggest button { padding: 7px 12px; border-radius: 999px; font-size: 13px; color: var(--muted); border: 1px solid var(--line); background: rgba(255, 255, 255, .03); transition: .25s; }
.suggest button:hover { color: var(--gold-2); border-color: var(--gold); transform: translateY(-2px); }

.breath { position: relative; height: 170px; display: grid; place-items: center; }
.breath-circle { position: absolute; width: 110px; height: 110px; border-radius: 50%;
  background: radial-gradient(circle, rgba(233, 201, 122, .5), rgba(139, 108, 255, .2) 60%, transparent 70%);
  border: 1px solid var(--gold); animation: breathCycle 8s ease-in-out infinite; }
@keyframes breathCycle { 0%, 100% { transform: scale(.7); opacity: .6; } 50% { transform: scale(1.35); opacity: 1; } }
.breath-text { position: relative; font-family: var(--serif); font-size: 24px; color: var(--gold-2); }
.muted { color: var(--muted); line-height: 1.5; }
.center { text-align: center; }

.section-label { margin: 22px 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: 3px; color: var(--gold); opacity: .85; }
.spreads { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.spread-opt { position: relative; padding: 12px; border-radius: 16px; border: 1px solid var(--line); background: rgba(0, 0, 0, .25); text-align: left; transition: .35s var(--ease); overflow: hidden; }
.spread-opt:hover { transform: translateY(-3px); border-color: rgba(233, 201, 122, .6); }
.spread-opt.active { border-color: var(--gold); background: linear-gradient(160deg, rgba(233, 201, 122, .16), rgba(139, 108, 255, .12)); box-shadow: 0 0 24px rgba(233, 201, 122, .2); }
.spread-opt b { display: block; font-size: 14px; margin-top: 8px; }
.spread-opt small { color: var(--muted); font-size: 12px; }
.mini { position: relative; height: 44px; }
.mini i { position: absolute; width: 14px; height: 22px; border-radius: 3px; border: 1px solid var(--gold); background: rgba(233, 201, 122, .12); transition: .4s var(--ease); }
.spread-opt.active .mini i { background: var(--gold); box-shadow: 0 0 8px var(--gold); }

.opts { display: flex; flex-wrap: wrap; gap: 12px 22px; margin: 20px 0 22px; }
.switch { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); cursor: pointer; user-select: none; }
.switch input { display: none; }
.slider { position: relative; width: 40px; height: 22px; border-radius: 99px; background: rgba(255, 255, 255, .12); transition: .3s; flex: none; }
.slider::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: .3s var(--ease); }
.switch input:checked + .slider { background: var(--gold); }
.switch input:checked + .slider::after { transform: translateX(18px); background: #1a1033; }

.btn-primary { position: relative; width: 100%; padding: 17px; border-radius: 16px; overflow: hidden; font-weight: 700; font-size: 17px; letter-spacing: .5px; color: #1a1033;
  background: linear-gradient(135deg, var(--gold-2), var(--gold) 50%, #d9a94e); box-shadow: 0 10px 30px rgba(233, 201, 122, .35); transition: .3s var(--ease); }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 14px 40px rgba(233, 201, 122, .5); }
.btn-primary:active { transform: scale(.98); }
.btn-primary .shine { position: absolute; top: 0; left: -60%; width: 40%; height: 100%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .7), transparent); transform: skewX(-20deg); animation: shine 3.5s ease-in-out infinite; }
@keyframes shine { 0%, 60% { left: -60%; } 100% { left: 130%; } }
.btn-ghost { padding: 12px 18px; border-radius: 14px; border: 1px solid var(--line); color: var(--gold-2); background: rgba(255, 255, 255, .04); font-weight: 600; transition: .3s var(--ease); display: inline-flex; align-items: center; gap: 8px; }
.btn-ghost:hover { border-color: var(--gold); background: rgba(233, 201, 122, .1); transform: translateY(-2px); }
.btn-ghost.small { padding: 8px 14px; font-size: 13px; }
.btn-ghost svg { width: 18px; height: 18px; }

/* стол */
.q-echo { text-align: center; font-family: var(--serif); font-size: clamp(20px, 3.4vw, 28px); font-style: italic; color: var(--gold-2); margin: 6px auto 4px; max-width: 760px; min-height: 1em; }
.status { text-align: center; color: var(--muted); min-height: 24px; letter-spacing: .5px; margin-bottom: 14px; transition: opacity .4s; }
.status .dots::after { content: ''; animation: dots 1.4s steps(4) infinite; }
@keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

.spread { position: relative; margin: 0 auto; transition: height .5s var(--ease); }
.slot { position: absolute; width: var(--cw); transition: left .7s var(--ease), top .7s var(--ease), width .7s var(--ease); }
.slot-frame { width: var(--cw); height: calc(var(--cw) * 1.7); transition: width .7s var(--ease), height .7s var(--ease); border-radius: calc(var(--cw) * .07); border: 1.5px dashed rgba(233, 201, 122, .45);
  display: grid; place-items: center; color: rgba(233, 201, 122, .55); font-family: var(--serif); font-size: calc(var(--cw) * .3);
  animation: slotGlow 2.6s ease-in-out infinite; background: rgba(233, 201, 122, .03); }
.slot.next .slot-frame { border-color: var(--gold); box-shadow: 0 0 25px rgba(233, 201, 122, .4), inset 0 0 25px rgba(233, 201, 122, .15); }
@keyframes slotGlow { 50% { box-shadow: 0 0 18px rgba(139, 108, 255, .35); } }
.slot-label { text-align: center; margin-top: 8px; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold); white-space: nowrap; }
.slot .card { position: absolute; top: 0; left: 0; }

.card { width: var(--cw); height: calc(var(--cw) * 1.7); perspective: 1200px; transition: width .7s var(--ease), height .7s var(--ease); }
.card-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 1s var(--ease); }
.card.flipped .card-inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 7%; overflow: hidden; box-shadow: 0 8px 24px rgba(0, 0, 0, .5); }
.face.front { transform: rotateY(180deg); }
.face.front.rev .card-svg { transform: rotate(180deg); }
.card-svg { display: block; width: 100%; height: 100%; }
.slot .card.flipped { cursor: zoom-in; }
.slot .card.flipped:hover .card-inner { transform: rotateY(180deg) translateY(-6px) scale(1.03); }
.slot .card.flipped .face.front { box-shadow: 0 10px 40px rgba(0, 0, 0, .6), 0 0 30px rgba(233, 201, 122, .25); }
.card.glow .face.front::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, .55) 50%, transparent 70%); background-size: 250% 100%; animation: sheen 1.4s ease-out forwards; pointer-events: none; }
@keyframes sheen { from { background-position: 150% 0; } to { background-position: -100% 0; } }

/* колода и веер */
.deck-zone { position: sticky; bottom: 0; z-index: 5; height: calc(var(--fcw) * 2.7); margin: 20px auto 0; transition: height .6s var(--ease), opacity .6s; }
.deck-zone.gone { height: 0; opacity: 0; margin: 0; }
.fan-card { position: absolute; left: calc(50% - var(--fcw) / 2); top: calc(var(--fcw) * .5); width: var(--fcw); height: calc(var(--fcw) * 1.7);
  transform-origin: 50% var(--om, 500%); --rot: 0deg; --lift: 0px; --x: 0px;
  transform: translateX(var(--x)) rotate(var(--rot)) translateY(var(--lift));
  transition: transform .7s var(--ease), opacity .4s, filter .3s; }
.fan-card .face { box-shadow: 0 4px 14px rgba(0, 0, 0, .55); }
.deck-zone.picking .fan-card { cursor: pointer; }
.deck-zone.picking .fan-card:hover, .fan-card.hover { --lift: calc(var(--fcw) * -.35); filter: drop-shadow(0 0 12px rgba(233, 201, 122, .8)); }
.fan-card.taken { opacity: 0; pointer-events: none; }
.deck-zone.cutting { cursor: pointer; }
.deck-zone.cutting .fan-card { animation: cutHint 1.6s ease-in-out infinite; scale: 1.8; }
.fan-card { transition: transform .7s var(--ease), opacity .4s, filter .3s, scale .5s var(--ease); }
.deck-zone.cutting .fan-card:last-child { filter: drop-shadow(0 0 16px rgba(233, 201, 122, .9)); }
@keyframes cutHint { 50% { translate: 0 -6px; } }
.flyer { position: fixed; z-index: 50; pointer-events: none; }
.flyer .face { box-shadow: 0 20px 50px rgba(0, 0, 0, .6), 0 0 30px rgba(233, 201, 122, .5); }

.spark { position: fixed; z-index: 60; width: 6px; height: 6px; border-radius: 50%; pointer-events: none; background: var(--gold-2); box-shadow: 0 0 10px var(--gold), 0 0 20px var(--gold); }

/* толкование */
.reading { max-width: 760px; margin: 34px auto 0; }
.r-item { display: grid; grid-template-columns: 64px 1fr; gap: 16px; padding: 18px; margin-bottom: 14px; border-radius: 20px;
  background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  animation: itemIn .9s var(--ease) both; cursor: pointer; transition: border-color .3s, transform .3s; }
.r-item:hover { border-color: rgba(233, 201, 122, .6); transform: translateY(-2px); }
@keyframes itemIn { from { opacity: 0; transform: translateY(30px); filter: blur(8px); } }
.r-thumb { width: 64px; height: 109px; border-radius: 6px; overflow: hidden; box-shadow: 0 6px 16px rgba(0, 0, 0, .5); }
.r-thumb.rev .card-svg { transform: rotate(180deg); }
.r-pos { font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--gold); }
.r-name { font-family: var(--serif); font-size: 26px; font-weight: 700; margin: 2px 0 6px; line-height: 1.1; }
.r-name em { font-family: var(--sans); font-style: normal; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 99px; background: rgba(255, 143, 184, .16); color: var(--rose); vertical-align: middle; margin-left: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.chips span { font-size: 12px; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.r-text { line-height: 1.6; margin: 0; }
.r-extra { line-height: 1.55; margin: 8px 0 0; color: var(--muted); font-size: 14.5px; }

.summary { position: relative; padding: 26px 22px; border-radius: 24px; margin-top: 26px; overflow: hidden;
  background: linear-gradient(160deg, rgba(233, 201, 122, .14), rgba(139, 108, 255, .14) 60%, rgba(255, 143, 184, .1));
  border: 1px solid rgba(233, 201, 122, .5); box-shadow: 0 0 60px rgba(139, 108, 255, .2); animation: itemIn 1s var(--ease) both; }
.summary::before { content: ''; position: absolute; inset: -50%; background: conic-gradient(from 0deg, transparent, rgba(233, 201, 122, .14), transparent 30%); animation: slowspin 12s linear infinite; pointer-events: none; }
.summary > * { position: relative; }
.summary h2 { font-family: var(--serif); font-size: 32px; margin: 0 0 6px; color: var(--gold-2); }
.verdict { display: inline-flex; align-items: center; gap: 10px; margin: 6px 0 14px; padding: 10px 18px; border-radius: 99px; font-family: var(--serif); font-size: 26px; font-weight: 700; color: #1a1033; background: linear-gradient(135deg, var(--gold-2), var(--gold)); box-shadow: 0 0 30px rgba(233, 201, 122, .5); animation: pop .8s var(--ease) both .3s; }
.verdict.neg { background: linear-gradient(135deg, #ffc0d4, #d97a9c); }
.verdict.mid { background: linear-gradient(135deg, #e5dcff, #a896ee); }
@keyframes pop { from { transform: scale(.3); opacity: 0; } 70% { transform: scale(1.08); } }
.summary p { line-height: 1.65; margin: 0 0 10px; }
.summary p.typing::after { content: '▍'; color: var(--gold); animation: blink .8s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.advice { margin-top: 16px; padding: 16px 18px; border-radius: 16px; background: rgba(0, 0, 0, .3); border-left: 3px solid var(--gold); font-family: var(--serif); font-size: 22px; font-style: italic; color: var(--gold-2); }
.advice small { display: block; font-family: var(--sans); font-style: normal; font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 26px 0 10px; animation: itemIn 1s var(--ease) both; }
.disclaimer { text-align: center; font-size: 12px; color: rgba(167, 159, 201, .6); margin-top: 18px; }

/* модалка */
.modal, .drawer { position: fixed; inset: 0; z-index: 80; visibility: hidden; }
.modal.open, .drawer.open { visibility: visible; }
.modal-bg, .drawer-bg { position: absolute; inset: 0; background: rgba(4, 2, 16, .75); backdrop-filter: blur(6px); opacity: 0; transition: opacity .4s; }
.open .modal-bg, .open .drawer-bg { opacity: 1; }
.modal-body { position: absolute; left: 50%; top: 50%; width: min(860px, calc(100% - 32px)); max-height: calc(100% - 32px); overflow: auto;
  transform: translate(-50%, -46%) scale(.9); opacity: 0; transition: .5s var(--ease);
  display: grid; grid-template-columns: minmax(180px, 300px) 1fr; gap: 26px; align-items: center; padding: 26px;
  background: linear-gradient(160deg, #1d1450, #0c0826); border: 1px solid var(--line); border-radius: 26px; box-shadow: 0 30px 80px rgba(0, 0, 0, .7); }
.modal.open .modal-body { transform: translate(-50%, -50%) scale(1); opacity: 1; }
.modal-x { position: absolute; right: 14px; top: 14px; }
.modal-card { border-radius: 18px; overflow: hidden; box-shadow: 0 0 50px rgba(233, 201, 122, .3); animation: float 5s ease-in-out infinite; }
.modal-card.rev .card-svg { transform: rotate(180deg); }
@keyframes float { 50% { transform: translateY(-8px) rotate(.8deg); } }
.modal-text h3 { font-family: var(--serif); font-size: 36px; margin: 0 0 4px; color: var(--gold-2); }
.modal-text .r-pos { margin-bottom: 4px; }
.modal-text p { line-height: 1.65; }
.modal-text h4 { margin: 16px 0 4px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); }

/* история */
.drawer-body { position: absolute; right: 0; top: 0; bottom: 0; width: min(400px, 100%); padding: calc(18px + env(safe-area-inset-top)) 18px 18px; overflow: auto;
  background: linear-gradient(180deg, #1a1248, #0a0722); border-left: 1px solid var(--line); transform: translateX(100%); transition: transform .5s var(--ease); }
.drawer.open .drawer-body { transform: none; }
.drawer-head { display: flex; justify-content: space-between; align-items: center; }
.drawer-head h2 { font-family: var(--serif); font-size: 30px; margin: 0; color: var(--gold-2); }
.history-list { margin: 16px 0; display: grid; gap: 10px; }
.h-item { text-align: left; padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255, 255, 255, .03); transition: .3s; }
.h-item:hover { border-color: var(--gold); transform: translateX(-4px); }
.h-item b { display: block; font-weight: 600; margin-bottom: 4px; }
.h-item small { color: var(--muted); }
.h-cards { display: flex; gap: 4px; margin-top: 8px; }
.h-cards div { width: 26px; height: 44px; border-radius: 3px; overflow: hidden; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 90; transform: translate(-50%, 40px); opacity: 0; padding: 12px 20px; border-radius: 14px; background: #2a1d66; border: 1px solid var(--gold); color: var(--gold-2); transition: .45s var(--ease); max-width: calc(100% - 32px); text-align: center; }
.toast.show { transform: translate(-50%, 0); opacity: 1; }

@media (max-width: 640px) {
  .panel { padding: 16px; border-radius: 20px; }
  .tab { font-size: 13px; gap: 5px; }
  .orb { width: 120px; height: 120px; }
  .orb-core { inset: 34px; }
  @keyframes orbit { from { transform: rotate(0) translateX(62px) rotate(0); } to { transform: rotate(360deg) translateX(62px) rotate(-360deg); } }
  .spreads { grid-template-columns: repeat(2, 1fr); }
  .r-item { grid-template-columns: 52px 1fr; gap: 12px; padding: 14px; }
  .r-thumb { width: 52px; height: 88px; }
  .r-name { font-size: 22px; }
  .modal-body { grid-template-columns: 1fr; padding: 20px; gap: 16px; }
  .modal-card { width: 62%; margin: 0 auto; }
  .slot-label { font-size: 10px; letter-spacing: .5px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

  function minorArt(card, accent, rnd) {

  function front(card) {

  function back() {

(function () {
  'use strict';
  const cv = document.getElementById('sky');
  const ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, dpr, stars = [], shooting = [], mx = 0, my = 0, tx = 0, ty = 0;

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = cv.width = innerWidth * dpr;
    H = cv.height = innerHeight * dpr;
    cv.style.width = innerWidth + 'px';
    cv.style.height = innerHeight + 'px';
    const n = Math.round(innerWidth * innerHeight / 5200);
    stars = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: (Math.random() ** 2 * 1.6 + .3) * dpr,
      d: Math.random() * .9 + .1,
      p: Math.random() * Math.PI * 2,
      s: Math.random() * .02 + .005,
      c: Math.random() < .15 ? '255,214,150' : Math.random() < .3 ? '190,200,255' : '255,255,255'
    }));
  }
  addEventListener('resize', resize);
  addEventListener('pointermove', e => { tx = (e.clientX / innerWidth - .5); ty = (e.clientY / innerHeight - .5); });

  window.Taro = window.Taro || {};
  window.Taro.skyBoost = 0; // ускорение звёзд во время тасования

  function frame() {
    mx += (tx - mx) * .04; my += (ty - my) * .04;
    ctx.clearRect(0, 0, W, H);
    const boost = window.Taro.skyBoost;
    for (const s of stars) {
      s.p += s.s * (1 + boost * 4);
      if (boost) { s.y -= s.d * boost * 2 * dpr; if (s.y < 0) s.y += H; }
      const a = .35 + Math.sin(s.p) * .35 + .3;
      const x = s.x - mx * 40 * s.d * dpr, y = s.y - my * 40 * s.d * dpr;
      ctx.beginPath();
      ctx.fillStyle = `rgba(${s.c},${a.toFixed(3)})`;
      ctx.arc(x, y, s.r, 0, 6.283);
      ctx.fill();
      if (s.r > 1.5 * dpr && a > .8) {
        ctx.fillStyle = `rgba(${s.c},.12)`;
        ctx.beginPath(); ctx.arc(x, y, s.r * 4, 0, 6.283); ctx.fill();
      }
    }
    if (Math.random() < .004 + boost * .03) {
      shooting.push({ x: Math.random() * W, y: Math.random() * H * .5, vx: (4 + Math.random() * 4) * dpr, vy: (2 + Math.random() * 2) * dpr, life: 1 });
    }
    shooting = shooting.filter(s => s.life > 0);
    for (const s of shooting) {
      const g = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * 18, s.y - s.vy * 18);
      g.addColorStop(0, `rgba(255,240,200,${s.life})`);
      g.addColorStop(1, 'rgba(255,240,200,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 1.6 * dpr;
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * 18, s.y - s.vy * 18); ctx.stroke();
      s.x += s.vx; s.y += s.vy; s.life -= .015;
    }
    if (!reduce) requestAnimationFrame(frame);
  }
  resize();
  frame();
})();

      ], { duration: 700 + Math.random() * 700, easing: 'cubic-bezier(.1,.8,.3,1)' }).onfinish = () => s.remove();
    }
  }
  function centerOf(el) { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }

  /* ---------------- Раскладка стола ---------------- */
  function layoutSpread(spread, compact) {
    const box = $('#spread');
    const W = Math.min(box.parentElement.clientWidth, 1000);
    const k = 0.2;
    const maxCw = spread.cols === 1 ? 180 : 150;
    const labelH = 30;
    let cw = Math.min(maxCw, W / (spread.cols + (spread.cols - 1) * k));
    // во время выбора стол и веер должны помещаться на экране
    const fanH = compact ? fanGeometry().zoneH + 20 : 0;
    const availH = innerHeight - 150 - fanH;
    cw = Math.min(cw, (availH - spread.rows * labelH) / (spread.rows * 1.7 + (spread.rows - 1) * .14));
    cw = Math.max(cw, compact ? 56 : 80);
    const gap = cw * k, gapY = cw * .14;
    const totalW = spread.cols * cw + (spread.cols - 1) * gap;
    const offX = (W - totalW) / 2;
    box.style.setProperty('--cw', cw + 'px');
    box.style.width = W + 'px';
    box.style.height = (spread.rows * (cw * 1.7 + labelH) + (spread.rows - 1) * gapY) + 'px';
    $$('#spread .slot').forEach((slot, i) => {
      const p = spread.pos[i];
      slot.style.left = (offX + p.x * (cw + gap)) + 'px';
      slot.style.top = (p.y * (cw * 1.7 + labelH + gapY)) + 'px';
    });
    return cw;
  }

  function buildSlots(spread, compact) {
    state.tableSpread = spread;
    $('#spread').innerHTML = spread.pos.map((p, i) => `<div class="slot" data-i="${i}">
      <div class="slot-frame">${i + 1}</div><div class="slot-label">${p.n}</div></div>`).join('');
    state.compact = !!compact;
    layoutSpread(spread, compact);
  }

  /* ---------------- Веер ---------------- */
  // в веере вся колода — 78 карт, как на настоящем столе
  function fanGeometry() {
    const W = $('#deckZone').parentElement.clientWidth;
    const angle = W < 500 ? 96 : 80;
    const om = 5; // радиус дуги в высотах карты
    const halfA = angle / 2 * Math.PI / 180;
    const widthK = 2 * om * 1.7 * Math.sin(halfA) + 1;
    const fcw = Math.max(28, Math.min(64, (W - 8) / widthK, innerHeight / 16));
    const drop = om * 1.7 * (1 - Math.cos(halfA));
    return { fcw, count: DECK.length, angle, om, zoneH: fcw * (1.7 + .5 + drop + .3) };
  }

  async function shuffleAndFan(token, deckOrder) {
    const zone = $('#deckZone');
    const { fcw, count, angle, om, zoneH } = fanGeometry();
    zone.className = 'deck-zone';
    zone.style.setProperty('--fcw', fcw + 'px');
    zone.style.setProperty('--om', (om * 100) + '%');
    zone.style.height = zoneH + 'px';
    zone.innerHTML = '';
    const cards = [];
    for (let i = 0; i < count; i++) {
      const c = document.createElement('div');
      c.className = 'fan-card';
      c.dataset.k = i;
      c.innerHTML = `<div class="face back">${art.back()}</div>`;
      c.style.zIndex = i;
      zone.appendChild(c);
      cards.push(c);
    }
    // появление колоды
    cards.forEach((c, i) => c.animate([
      { transform: 'translateY(-160px) rotate(-20deg) scale(.6)', opacity: 0 },
      { transform: 'translateY(0) rotate(0) scale(1)', opacity: 1 }
    ], { duration: 700, delay: i * 6, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' }));
    await wait(700 + count * 6);
    if (token !== state.run) return null;

    // тасование: три «рифла» и снятие
    window.Taro.skyBoost = 1;
    const rounds = reduceMotion ? 0 : 3;
    for (let r = 0; r < rounds; r++) {
      const anims = cards.map((c, i) => {
        const dir = i % 2 ? 1 : -1;
        const dx = dir * fcw * (.75 + Math.random() * .25);
        return c.animate([
          { transform: 'translate(0,0) rotate(0)' },
          { transform: `translate(${dx}px, ${-6 - Math.random() * 10}px) rotate(${dir * (8 + Math.random() * 8)}deg)`, offset: .45 },
          { transform: `translate(${dx * .2}px, -2px) rotate(${dir * 2}deg)`, offset: .8 },
          { transform: 'translate(0,0) rotate(0)' }
        ], { duration: 640, delay: i * 3, easing: 'ease-in-out' });
      });
      setTimeout(() => cards.forEach(c => { c.style.zIndex = Math.floor(Math.random() * count); }), 330);
      await Promise.all(anims.map(a => a.finished.catch(() => { })));
      if (token !== state.run) return null;
    }
    window.Taro.skyBoost = 0;
    if (token !== state.run) return null;

    // снятие колоды — делает сам спрашивающий, как в живом гадании
    setStatus('Сними колоду — нажми на неё');
    zone.classList.add('cutting');
    await new Promise(resolve => zone.addEventListener('click', resolve, { once: true }));
    zone.classList.remove('cutting');
    if (token !== state.run) return null;
    const cutAt = 15 + Math.floor(reading.secureRandom() * (count - 30));
    const order = deckOrder.slice(cutAt).concat(deckOrder.slice(0, cutAt));
    setStatus('Колода снята');
    if (!reduceMotion) {
      const top = cards.slice(cutAt);
      await Promise.all(top.map(c => c.animate([
        { transform: 'translate(0,0)' }, { transform: `translate(0, ${-fcw * 1.3}px) rotate(4deg)`, offset: .4 },
        { transform: `translate(${fcw * 1.2}px, ${-fcw * .4}px) rotate(10deg)`, offset: .7 }, { transform: 'translate(0,0)' }
      ], { duration: 900, easing: 'ease-in-out' }).finished.catch(() => { })));
    }
    if (token !== state.run) return null;

    // раскрываем веер
    cards.forEach((c, i) => {
      c.style.zIndex = i;
      c.style.transitionDelay = (i * 8) + 'ms';
      c.style.setProperty('--rot', (-angle / 2 + angle * i / (count - 1)) + 'deg');
    });
    await wait(700 + count * 8);
    cards.forEach(c => { c.style.transitionDelay = '0ms'; });
    return cards.map((el, i) => ({ el, card: order[i] }));
  }

  function flyToSlot(fanEl, slot, cardData, reversed) {
    return new Promise(resolve => {
      const fr = fanEl.getBoundingClientRect();
      const sr = slot.querySelector('.slot-frame').getBoundingClientRect();
      const fcw = parseFloat(getComputedStyle($('#deckZone')).getPropertyValue('--fcw'));
      const w = fcw, h = fcw * 1.7;
      const rot = parseFloat(fanEl.style.getPropertyValue('--rot')) || 0;
      const sx = fr.left + fr.width / 2 - w / 2, sy = fr.top + fr.height / 2 - h / 2;
      const tx = sr.left + sr.width / 2 - w / 2, ty = sr.top + sr.height / 2 - h / 2;
      const scale = sr.width / w;
      const fly = document.createElement('div');
      fly.className = 'flyer';
      fly.style.cssText = `left:0;top:0;width:${w}px;height:${h}px;`;
      fly.innerHTML = `<div class="face back">${art.back()}</div>`;
      document.body.appendChild(fly);
      fanEl.classList.add('taken');
      const midX = (sx + tx) / 2 + (Math.random() - .5) * 80, midY = Math.min(sy, ty) - 60;
      fly.animate([
        { transform: `translate(${sx}px, ${sy}px) rotate(${rot}deg) scale(1)` },
        { transform: `translate(${midX}px, ${midY}px) rotate(${rot / 2 + 8}deg) scale(${(1 + scale) / 2 * 1.12})`, offset: .55 },
        { transform: `translate(${tx}px, ${ty}px) rotate(0deg) scale(${scale})` }
      ], { duration: reduceMotion ? 10 : 820, easing: 'cubic-bezier(.45,.05,.25,1)', fill: 'forwards' }).onfinish = () => {
        const el = cardEl(cardData, reversed, false);
        slot.appendChild(el);
        slot.querySelector('.slot-frame').style.visibility = 'hidden';
        fly.remove();
        const [cx, cy] = centerOf(el);
        burst(cx, cy, 12, 60);
        el.animate([{ transform: 'scale(1.06)' }, { transform: 'scale(1)' }], { duration: 300, easing: 'ease-out' });
        resolve(el);
      };
    });
  }

  /* ---------------- Ход ритуала ---------------- */
  function setStatus(html) {
    const s = $('#status');
    s.style.opacity = 0;
    setTimeout(() => { s.innerHTML = html; s.style.opacity = 1; }, 200);
  }

  async function startReading() {
    const silent = true; // вопрос задаётся мысленно или вслух
    const question = '';
    stopSpeak();
    const token = ++state.run;
    const spread = state.spread;
    const pickSelf = true;
    const allowRev = true;
    const order = reading.shuffled();

    show('screenTable');
    $('#qEcho').textContent = '✦ Держи вопрос в мыслях ✦';
    $('#reading').innerHTML = '';
    buildSlots(spread, true);
    setStatus(silent ? 'Держите вопрос в мыслях — тасую колоду<span class="dots"></span>' : 'Тасую колоду<span class="dots"></span>');

    await wait(400);
    const fan = await shuffleAndFan(token, order);
    if (!fan || token !== state.run) return;

    const draws = [];
    const zone = $('#deckZone');
    const slots = $$('#spread .slot');
    const markNext = () => slots.forEach((s, i) => s.classList.toggle('next', i === draws.length));
    markNext();

    const takeCard = async (item) => {
      const posIndex = draws.length;
      const reversed = allowRev && reading.secureRandom() < 0.5;
      const d = { card: item.card, reversed, posIndex };
      draws.push(d);
      markNext();
      d.el = await flyToSlot(item.el, slots[posIndex], item.card, reversed);
    };

    const need = spread.pos.length;
    if (pickSelf) {
      setStatus(`Выберите ${need === 1 ? 'одну карту' : need + ' ' + (need < 5 ? 'карты' : 'карт')} — доверьтесь руке`);
      zone.classList.add('picking');
      await new Promise(resolve => {
        const flights = [];
        const onPick = e => {
          const el = e.target.closest('.fan-card');
          if (!el || el.classList.contains('taken') || draws.length >= need || token !== state.run) return;
          const item = fan.find(f => f.el === el);
          flights.push(takeCard(item));
          if (draws.length < need) setStatus(`Осталось выбрать: ${need - draws.length}`);
          else {
            zone.classList.remove('picking');
            zone.removeEventListener('click', onPick);
            Promise.all(flights).then(resolve);
          }
        };
        zone.addEventListener('click', onPick);
      });
    } else {
      setStatus('Колода сама выбирает карты<span class="dots"></span>');
      const avail = fan.slice();
      for (let i = 0; i < need; i++) {
        const k = Math.floor(reading.secureRandom() * avail.length);
        const item = avail.splice(k, 1)[0];
        item.el.classList.add('hover');
        await wait(450);
        if (token !== state.run) return;
        item.el.classList.remove('hover');
        await takeCard(item);
      }
    }
    if (token !== state.run) return;
    slots.forEach(s => s.classList.remove('next'));

    // убрать веер
    fan.forEach((f, i) => {
      if (!f.el.classList.contains('taken')) {
        f.el.animate([{ opacity: 1 }, { transform: `translateY(${60 + Math.random() * 40}px) rotate(${(Math.random() - .5) * 30}deg)`, opacity: 0 }],
          { duration: 600, delay: i * 15, fill: 'forwards', easing: 'ease-in' });
      }
    });
    await wait(700);
    zone.classList.add('gone');
    zone.style.height = '';
    state.compact = false;
    scrollTo({ top: 0, behavior: 'smooth' });
    layoutSpread(spread, false); // карты плавно увеличиваются
    await wait(750);
    if (token !== state.run) return;

    // переворот
    for (const d of draws) {
      setStatus(`Открываю: ${spread.pos[d.posIndex].n.toLowerCase()}`);
      await wait(reduceMotion ? 50 : 520);
      if (token !== state.run) return;
      d.el.classList.add('flipped');
      await wait(reduceMotion ? 50 : 480);
      d.el.classList.add('glow');
      const [cx, cy] = centerOf(d.el);
      burst(cx, cy, 26, 110);
      d.el.addEventListener('click', () => openModal(d, spread));
    }
    if (token !== state.run) return;
    setStatus('Карты открыты. Читаю расклад…');
    await wait(600);

    const result = buildResult(draws, spread, question, silent);
    state.current = result;
    saveHistory(result);
    await renderReading(result, token, true);
    setStatus('');
  }
  $('#go').addEventListener('click', startReading);

  function buildResult(draws, spread, question, silent) {
    const theme = reading.detectTheme(question);
    const items = draws.map(d => ({ id: d.card.id, reversed: d.reversed, posIndex: d.posIndex, ...reading.cardText(d, spread, theme) }));
    const sum = reading.summarize(draws, spread, question, silent);
    return { date: Date.now(), question, silent, spreadId: spread.id, items, summary: sum };
  }

  /* ---------------- Толкование ---------------- */
  async function typeInto(el, text, token) {
    if (reduceMotion) { el.textContent = text; return; }
    el.classList.add('typing');
    for (let i = 0; i <= text.length; i += 3) {
      if (token !== state.run) return;
      if (state.skipTyping) { el.textContent = text; break; }
      el.textContent = text.slice(0, i);
      await wait(14);
    }
    el.textContent = text;
    el.classList.remove('typing');
  }

  async function renderReading(res, token, animate) {
    const spread = SPREADS.find(s => s.id === res.spreadId);
    const box = $('#reading');
    box.innerHTML = '';
    state.skipTyping = !animate;
    res.items.forEach((it, i) => {
      const card = BY_ID[it.id];
      const pos = spread.pos[it.posIndex];
      const div = document.createElement('article');
      div.className = 'r-item';
      div.style.animationDelay = (animate ? i * 180 : 0) + 'ms';
      div.innerHTML = `<div class="r-thumb ${it.reversed ? 'rev' : ''}">${art.front(card)}</div>
        <div><div class="r-pos">${i + 1}. ${pos.n} · ${pos.d}</div>
        <div class="r-name">${card.name}${it.reversed ? '<em>перевёрнута</em>' : ''}</div>
        <div class="chips">${card.keywords.split(',').map(k => `<span>${k.trim()}</span>`).join('')}</div>
        <p class="r-text">${it.base}</p>${it.extra ? `<p class="r-extra">${it.extra}</p>` : ''}</div>`;
      div.addEventListener('click', () => openModal({ card, reversed: it.reversed, posIndex: it.posIndex }, spread));
      box.appendChild(div);
    });
    if (animate) {
      await wait(150);
      box.scrollIntoView({ behavior: 'smooth', block: 'start' });
      await wait(res.items.length * 180 + 600);
    }
    if (token !== state.run) return;

    const s = res.summary;
    const sum = document.createElement('section');
    sum.className = 'summary';
    const vClass = !s.verdict ? '' : /нет/i.test(s.verdict) ? 'neg' : /неясно/i.test(s.verdict) ? 'mid' : '';
    sum.innerHTML = `<h2>Разбор расклада</h2>
      ${s.verdict ? `<div class="verdict ${vClass}">✦ ${s.verdict}</div>` : ''}
      <div class="sum-text">${s.paragraphs.map(() => '<p></p>').join('')}</div>
      <div class="advice" style="opacity:0"><small>Совет карт</small>${s.advice}</div>`;
    box.appendChild(sum);
    sum.addEventListener('click', () => { state.skipTyping = true; });
    const ps = sum.querySelectorAll('.sum-text p');
    for (let i = 0; i < s.paragraphs.length; i++) {
      await typeInto(ps[i], s.paragraphs[i], token);
      if (token !== state.run) return;
    }
    const adv = sum.querySelector('.advice');
    adv.style.opacity = 1;
    if (animate) {
      adv.animate([{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }], { duration: 700, easing: 'ease-out' });
      const [cx, cy] = centerOf(adv);
      burst(cx, cy, 30, 140);
    }

    const actions = document.createElement('div');
    actions.className = 'actions';
    actions.innerHTML = `
      <button class="btn-ghost" id="aSpeak"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Озвучить</span></button>
      <button class="btn-ghost" id="aCopy"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>Поделиться</button>
      <button class="btn-ghost" id="aNew"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3M18 3v4h-4M6 21v-4h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Новый вопрос</button>`;
    box.appendChild(actions);
    const disc = document.createElement('p');
    disc.className = 'disclaimer';
    disc.textContent = 'Расклад — повод для размышления, а не руководство к действию. Важные решения принимайте сами.';
    box.appendChild(disc);
    $('#aSpeak').addEventListener('click', () => speak(res));
    $('#aCopy').addEventListener('click', () => share(res));
    $('#aNew').addEventListener('click', () => { state.run++; stopSpeak(); show('screenAsk'); });
  }

  function plainText(res) {
    const spread = SPREADS.find(s => s.id === res.spreadId);
    const lines = [`🔮 Таролог · ${spread.name}`, res.silent ? 'Вопрос загадан про себя' : `Вопрос: ${res.question}`, ''];
    res.items.forEach((it, i) => {
      const c = BY_ID[it.id];
      lines.push(`${i + 1}. ${spread.pos[it.posIndex].n}: ${c.name}${it.reversed ? ' (перевёрнута)' : ''}`);
      lines.push(it.base);
    });
    lines.push('', 'Разбор:');
    if (res.summary.verdict) lines.push('Ответ: ' + res.summary.verdict);
    lines.push(...res.summary.paragraphs, '', 'Совет: ' + res.summary.advice);
    return lines.join('\n');
  }
  async function share(res) {
    const text = plainText(res);
    if (navigator.share) { try { await navigator.share({ title: 'Мой расклад Таро', text }); return; } catch (e) { if (e.name === 'AbortError') return; } }
    try { await navigator.clipboard.writeText(text); toast('Расклад скопирован'); } catch (e) { toast('Не удалось скопировать'); }
  }

  /* ---------------- Озвучка ---------------- */
  function stopSpeak() {
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    const b = $('#aSpeak span'); if (b) b.textContent = 'Озвучить';
  }
  function speak(res) {
    if (!('speechSynthesis' in window)) return toast('Озвучка недоступна в этом браузере');
    if (speechSynthesis.speaking) return stopSpeak();
    const spread = SPREADS.find(s => s.id === res.spreadId);
    const parts = res.items.map(it => `${spread.pos[it.posIndex].n}. ${BY_ID[it.id].name}${it.reversed ? ', в перевёрнутом положении' : ''}. ${it.base}`);
    if (res.summary.verdict) parts.push('Ответ карт: ' + res.summary.verdict + '.');
    parts.push(...res.summary.paragraphs, 'Совет карт: ' + res.summary.advice);
    const voices = speechSynthesis.getVoices().filter(v => /^ru/i.test(v.lang));
    const voice = voices.find(v => /female|milena|алёна|алена|irina|google/i.test(v.name)) || voices[0];
    parts.forEach((p, i) => {
      const u = new SpeechSynthesisUtterance(p);
      u.lang = 'ru-RU'; u.rate = .95; u.pitch = 1;
      if (voice) u.voice = voice;
      if (i === parts.length - 1) u.onend = stopSpeak;
      speechSynthesis.speak(u);
    });
    $('#aSpeak span').textContent = 'Остановить';
  }

  /* ---------------- Модалка карты ---------------- */
  function openModal(d, spread) {
    const { card, reversed } = d;
    const pos = spread.pos[d.posIndex];
    $('#modalCard').className = 'modal-card' + (reversed ? ' rev' : '');
    $('#modalCard').innerHTML = art.front(card);
    const arcana = card.arcana === 'major' ? `Старший Аркан ${card.numeral}` : `Младший Аркан · ${reading.SUITS[card.suit].name} · ${reading.SUITS[card.suit].element}`;
    $('#modalText').innerHTML = `<div class="r-pos">${pos ? pos.n + ' · ' : ''}${arcana}</div>
      <h3>${card.name}</h3>
      <div class="chips">${card.keywords.split(',').map(k => `<span>${k.trim()}</span>`).join('')}</div>
      <h4>${reversed ? 'Перевёрнутое положение — ваша карта' : 'Прямое положение — ваша карта'}</h4>
      <p>${reversed ? card.rev : card.up}</p>
      <h4>${reversed ? 'В прямом положении' : 'В перевёрнутом положении'}</h4>
      <p class="muted">${reversed ? card.up : card.rev}</p>
      <h4>Совет</h4><p><i>${card.advice}</i></p>`;
    $('#modal').classList.add('open');
    $('#modal').setAttribute('aria-hidden', 'false');
  }
  function closeOverlays() {
    $$('.modal, .drawer').forEach(m => { m.classList.remove('open'); m.setAttribute('aria-hidden', 'true'); });
  }
  document.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeOverlays(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlays(); });

  /* ---------------- История ---------------- */
  const HKEY = 'taro.history.v1';
  function loadHistory() { try { return JSON.parse(localStorage.getItem(HKEY)) || []; } catch (e) { return []; } }
  function saveHistory(res) {
    try { const h = loadHistory(); h.unshift(res); localStorage.setItem(HKEY, JSON.stringify(h.slice(0, 30))); } catch (e) { /* ignore */ }
  }
  function renderHistory() {
    const h = loadHistory();
    const list = $('#historyList');
    if (!h.length) { list.innerHTML = '<p class="muted">Здесь будут ваши расклады.</p>'; return; }
    list.innerHTML = h.map((r, i) => {
      const sp = SPREADS.find(s => s.id === r.spreadId);
      const date = new Date(r.date).toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
      return `<button class="h-item" data-i="${i}"><b>${r.silent ? '✦ Загадано про себя' : r.question}</b>
        <small>${sp ? sp.name : ''} · ${date}${r.summary.verdict ? ' · ' + r.summary.verdict : ''}</small>
        <div class="h-cards">${r.items.map(it => `<div class="${it.reversed ? 'r-thumb rev' : ''}" style="width:26px;height:44px">${art.front(BY_ID[it.id])}</div>`).join('')}</div></button>`;
    }).join('');
  }
  $('#openHistory').addEventListener('click', () => { renderHistory(); $('#drawer').classList.add('open'); $('#drawer').setAttribute('aria-hidden', 'false'); });
  $('#historyList').addEventListener('click', e => {
    const b = e.target.closest('.h-item');
    if (!b) return;
    const res = loadHistory()[+b.dataset.i];
    closeOverlays();
    reopen(res);
  });
  $('#clearHistory').addEventListener('click', () => { try { localStorage.removeItem(HKEY); } catch (e) { /* ignore */ } renderHistory(); toast('История очищена'); });

  function reopen(res) {
    const token = ++state.run;
    stopSpeak();
    const spread = SPREADS.find(s => s.id === res.spreadId);
    show('screenTable');
    $('#qEcho').textContent = res.silent ? '✦ Вопрос загадан про себя ✦' : '«' + res.question + '»';
    $('#status').textContent = new Date(res.date).toLocaleString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    $('#deckZone').className = 'deck-zone gone';
    $('#deckZone').innerHTML = '';
    buildSlots(spread);
    const slots = $$('#spread .slot');
    res.items.forEach((it, i) => {
      const card = BY_ID[it.id];
      const el = cardEl(card, it.reversed, false);
      slots[it.posIndex].appendChild(el);
      slots[it.posIndex].querySelector('.slot-frame').style.visibility = 'hidden';
      setTimeout(() => el.classList.add('flipped'), 300 + i * 200);
      el.addEventListener('click', () => openModal({ card, reversed: it.reversed, posIndex: it.posIndex }, spread));
    });
    state.current = res;
    renderReading(res, token, false);
  }

  addEventListener('resize', () => {
    if ($('#screenTable').classList.contains('active')) {
      if (state.tableSpread) layoutSpread(state.tableSpread, state.compact);
    }
  });

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { }));
  }
})();

</script>
</body>
</html>
