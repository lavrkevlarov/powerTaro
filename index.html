<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Таролог</title>
  <meta name="description" content="Таролог — задайте вопрос текстом, голосом или загадайте про себя. Расклад и разбор карт сразу.">
  <meta name="theme-color" content="#0a0720">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="nebula" aria-hidden="true"></div>

  <header class="topbar">
    <button class="brand" id="home" aria-label="На главную">
      <svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true">
        <circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <path d="M24 9a11 11 0 1 0 0 22a9 9 0 1 1 0-22z" fill="currentColor"/>
        <circle cx="27" cy="14" r="1.4" fill="currentColor"/><circle cx="30" cy="22" r="1" fill="currentColor"/>
      </svg>
      <span>Таролог</span>
    </button>
    <button class="icon-btn" id="openHistory" aria-label="История раскладов" title="История">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 7v5l3 2M3.5 12a8.5 8.5 0 1 0 2.5-6M3 4v4h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <main class="app">
    <!-- ЭКРАН ВОПРОСА -->
    <section id="screenAsk" class="screen active">
      <div class="hero hero-simple">
        <div class="orb" aria-hidden="true">
          <div class="orb-ring r1"></div><div class="orb-ring r2"></div><div class="orb-ring r3"></div>
          <div class="orb-core"></div>
          <div class="orb-cards"><span></span><span></span><span></span></div>
        </div>
        <h1 class="title">Задай свой вопрос</h1>
        <p class="lead">Мысленно или вслух — и нажми «Расклад»</p>
        <button class="btn-primary btn-go" id="go"><span>Расклад</span><i class="shine"></i></button>
      </div>
    </section>

    <!-- ЭКРАН РАСКЛАДА -->
    <section id="screenTable" class="screen">
      <div class="q-echo" id="qEcho"></div>
      <div class="status" id="status"></div>
      <div class="spread" id="spread"></div>
      <div class="deck-zone" id="deckZone"></div>
      <div class="reading" id="reading"></div>
    </section>
  </main>

  <!-- Модальное окно карты -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-bg" data-close></div>
    <div class="modal-body">
      <button class="icon-btn modal-x" data-close aria-label="Закрыть">✕</button>
      <div class="modal-card" id="modalCard"></div>
      <div class="modal-text" id="modalText"></div>
    </div>
  </div>

  <!-- История -->
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-bg" data-close></div>
    <div class="drawer-body">
      <div class="drawer-head"><h2>История</h2><button class="icon-btn" data-close aria-label="Закрыть">✕</button></div>
      <div id="historyList" class="history-list"></div>
      <button class="btn-ghost small" id="clearHistory">Очистить историю</button>
    </div>
  </aside>

  <div class="toast" id="toast"></div>

  <script src="js/cards.js"></script>
  <script src="js/art.js"></script>
  <script src="js/reading.js"></script>
  <script src="js/sky.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
