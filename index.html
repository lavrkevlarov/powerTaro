<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Таролог</title>
  <meta name="description" content="Таролог — задайте вопрос текстом, голосом или загадайте про себя. Расклад и разбор карт сразу.">
  <meta name="theme-color" content="#0a0720">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="nebula" aria-hidden="true"></div>

  <header class="topbar">
    <button class="brand" id="home" aria-label="На главную">
      <svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true">
        <circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <path d="M24 9a11 11 0 1 0 0 22a9 9 0 1 1 0-22z" fill="currentColor"/>
        <circle cx="27" cy="14" r="1.4" fill="currentColor"/><circle cx="30" cy="22" r="1" fill="currentColor"/>
      </svg>
      <span>Таролог</span>
    </button>
    <button class="icon-btn" id="openHistory" aria-label="История раскладов" title="История">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 7v5l3 2M3.5 12a8.5 8.5 0 1 0 2.5-6M3 4v4h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <main class="app">
    <!-- ЭКРАН ВОПРОСА -->
    <section id="screenAsk" class="screen active">
      <div class="hero">
        <div class="orb" aria-hidden="true">
          <div class="orb-ring r1"></div><div class="orb-ring r2"></div><div class="orb-ring r3"></div>
          <div class="orb-core"></div>
          <div class="orb-cards"><span></span><span></span><span></span></div>
        </div>
        <h1 class="title">Спросите у карт</h1>
        <p class="lead">Напишите вопрос, продиктуйте его или просто загадайте про себя</p>
      </div>

      <div class="panel">
        <div class="tabs" role="tablist">
          <button class="tab active" data-mode="write" role="tab">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>Написать</button>
          <button class="tab" data-mode="voice" role="tab">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Голосом</button>
          <button class="tab" data-mode="silent" role="tab">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.4L19 10l-5.2 1.6L12 17l-1.8-5.4L5 10l5.2-1.6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="19" cy="19" r="1.4" fill="currentColor"/></svg>Про себя</button>
          <span class="tab-glider"></span>
        </div>

        <div class="mode mode-write mode-voice active" id="askBox">
          <div class="voice-stage" id="voiceStage">
            <button class="mic-big" id="micBig" aria-label="Начать диктовку">
              <span class="wave w1"></span><span class="wave w2"></span><span class="wave w3"></span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <div class="voice-hint" id="voiceHint">Нажмите и говорите</div>
          </div>
          <div class="field">
            <textarea id="question" rows="3" maxlength="300" placeholder="Например: что меня ждёт в работе в ближайший месяц?"></textarea>
            <button class="mic-small" id="micSmall" aria-label="Продиктовать" title="Продиктовать">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
          </div>
          <div class="suggest" id="suggest"></div>
        </div>

        <div class="mode mode-silent" id="silentBox">
          <div class="breath"><div class="breath-circle"></div><div class="breath-text" id="breathText">Вдох…</div></div>
          <p class="muted center">Закройте глаза и мысленно сформулируйте вопрос. Держите его в голове, пока колода тасуется.</p>
        </div>

        <div class="section-label">Расклад</div>
        <div class="spreads" id="spreads"></div>

        <div class="opts">
          <label class="switch"><input type="checkbox" id="optPick" checked><span class="slider"></span>Выбрать карты самому</label>
          <label class="switch"><input type="checkbox" id="optRev" checked><span class="slider"></span>Перевёрнутые карты</label>
        </div>

        <button class="btn-primary" id="go"><span>Сделать расклад</span><i class="shine"></i></button>
      </div>
    </section>

    <!-- ЭКРАН РАСКЛАДА -->
    <section id="screenTable" class="screen">
      <div class="q-echo" id="qEcho"></div>
      <div class="status" id="status"></div>
      <div class="spread" id="spread"></div>
      <div class="deck-zone" id="deckZone"></div>
      <div class="reading" id="reading"></div>
    </section>
  </main>

  <!-- Модальное окно карты -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-bg" data-close></div>
    <div class="modal-body">
      <button class="icon-btn modal-x" data-close aria-label="Закрыть">✕</button>
      <div class="modal-card" id="modalCard"></div>
      <div class="modal-text" id="modalText"></div>
    </div>
  </div>

  <!-- История -->
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-bg" data-close></div>
    <div class="drawer-body">
      <div class="drawer-head"><h2>История</h2><button class="icon-btn" data-close aria-label="Закрыть">✕</button></div>
      <div id="historyList" class="history-list"></div>
      <button class="btn-ghost small" id="clearHistory">Очистить историю</button>
    </div>
  </aside>

  <div class="toast" id="toast"></div>

  <script src="js/cards.js"></script>
  <script src="js/art.js"></script>
  <script src="js/reading.js"></script>
  <script src="js/sky.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
